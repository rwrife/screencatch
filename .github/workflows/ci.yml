name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./scripts/install-ffmpeg-macos.sh "$RUNNER_TEMP/ffmpeg-tools"
          echo "$RUNNER_TEMP/ffmpeg-tools" >> "$GITHUB_PATH"
      - name: Restore
        run: dotnet restore ScreenCatch.sln
      - name: Build
        run: dotnet build ScreenCatch.sln --configuration Release --no-restore
      - name: Test ScreenCatch.Core
        run: dotnet test tests/ScreenCatch.Core.Tests/ScreenCatch.Core.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=core-tests.trx"
      - name: Test application and CLI
        run: dotnet test ScreenCatch.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

  package-windows:
    name: Package Windows
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
      - name: Build portable ZIP and signed MSIX
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Upload Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: screencatch-windows
          path: |
            artifacts/windows/screencatch-win-x64.zip
            artifacts/windows/screencatch-win-x64.msix
            artifacts/windows/screencatch-dev-signing.cer
          if-no-files-found: error

  package-macos:
    name: Package macOS
    needs: test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
      - name: Build universal application and DMG
        shell: bash
        run: ./scripts/package-macos.sh
      - name: Upload macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: screencatch-macos
          path: artifacts/macos/screencatch-macOS-universal.dmg
          if-no-files-found: error
